spring.application.name=furima
spring.datasource.url=jdbc:postgresql://localhost:5432/furima_development
spring.datasource.username=${POSTGRESQL_USER}
spring.datasource.password=${POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Thymeleaf設定
spring.thymeleaf.cache=false

# Flyway設定
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Payjp設定
payjp.secret-key=${PAYJP_SECRET_KEY}
payjp.public-key=${PAYJP_PUBLIC_KEY}

# URL直入力やページ遷移時にログイン状態が保持されるようにする設定
server.servlet.session.cookie.same-site=lax

# スネークケースをキャメルケースに紐づける設定
mybatis.configuration.map-underscore-to-camel-case=true