<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Furima</title>
  <link rel="stylesheet" href="/css/application.css">
  <link rel="stylesheet" href="/css/shared/header.css">
  <link rel="stylesheet" href="/css/shared/footer.css">
  <link rel="stylesheet" href="/css/items/show.css">
</head>
<body>
  <div th:replace="~{shared/header :: top-header}"></div>

  <!-- 商品の概要 -->
  <div class="item-show">
    <div class="item-box">
      <h2 class="name" th:text="${item.name}">商品名</h2>
      
      <div class="item-img-content">
        <img th:src="${item.img}" class="item-box-img" alt="商品画像">

        <!-- 購入判定(isSold)がある場合 -->
        <div class="sold-out" th:if="${isSold}">
          <span>Sold Out!!</span>
        </div>
      </div>

      <div class="item-price-box">
        <span class="item-price" th:text="'¥ ' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}">
          ¥ 999,999,999
        </span>
        <span class="item-postage" th:text="${item.getDeliveryFeeText()}">
          配送料負担
        </span>
      </div>

      <!-- ログイン時のボタン出し分け -->
      <div sec:authorize="isAuthenticated()" class="item-btn-box">
        <!-- 出品者本人の場合 -->
        <th:block th:if="${#authentication.principal.class.simpleName == 'CustomUserDetails' and #authentication.principal.user.id == item.user.id}">
          <a th:href="@{/items/{itemId}/edit(itemId=${item.id})}" class="item-red-btn">商品の編集</a>
          <p class="or-text">or</p>
          <form th:action="@{/items/{itemId}/delete(itemId=${item.id})}" method="post" class="delete-form">
            <button type="submit" class="item-destroy">削除</button>
          </form>
        </th:block>

        <!-- 出品者以外の場合 -->
        <th:block th:unless="${#authentication.principal.class.simpleName == 'CustomUserDetails' and #authentication.principal.user.id == item.user.id}">
          <a th:href="@{/items/{itemId}/orders(itemId=${item.id})}" class="item-red-btn">購入画面に進む</a>
        </th:block>
      </div>

      <div class="item-explain-box">
        <span th:text="${item.description}">商品説明</span>
      </div>

      <table class="detail-table">
        <tbody>
          <tr>
            <th class="detail-item">出品者</th>
            <td class="detail-value" th:text="${item.user != null ? item.user.nickname : '不明'}">出品者名</td>
          </tr>
          <tr>
            <th class="detail-item">カテゴリー</th>
            <td class="detail-value" th:text="${item.getCategoryText()}">カテゴリー名</td>
          </tr>
          <tr>
            <th class="detail-item">商品の状態</th>
            <td class="detail-value" th:text="${item.getConditionText()}">商品の状態</td>
          </tr>
          <tr>
            <th class="detail-item">配送料の負担</th>
            <td class="detail-value" th:text="${item.getDeliveryFeeText()}">配送料の負担</td>
          </tr>
          <tr>
            <th class="detail-item">発送元の地域</th>
            <td class="detail-value" th:text="${item.getPrefectureText()}">発送元の地域</td>
          </tr>
          <tr>
            <th class="detail-item">発送日の目安</th>
            <td class="detail-value" th:text="${item.getUntilDeliveryText()}">発送日の目安</td>
          </tr>
        </tbody>
      </table>

      <div class="option">
        <div class="favorite-btn">
          <img src="/images/star.png" class="favorite-star-icon" width="20" height="20" alt="">
          <span>お気に入り 0</span>
        </div>
        <div class="report-btn">
          <img src="/images/flag.png" class="report-flag-icon" width="20" height="20" alt="">
          <span>不適切な商品の通報</span>
        </div>
      </div>
    </div>
  </div>

  <div class="comment-box">
    <form>
      <textarea class="comment-text"></textarea>
      <p class="comment-warn">
        相手のことを考え丁寧なコメントを心がけましょう。<br>
        不快な言葉遣いなどは利用制限や退会処分となることがあります。
      </p>
      <button type="submit" class="comment-btn">
        <img src="/images/comment.png" class="comment-flag-icon" width="20" height="25" alt="">
        <span>コメントする</span>
      </button>
    </form>
  </div>

  <div class="links">
    <a href="#" class="change-item-btn">＜ 前の商品</a>
    <a href="#" class="change-item-btn">後ろの商品 ＞</a>
  </div>

  <a href="#" class="another-item" th:text="${item.getCategoryText()} + 'をもっと見る'">商品のカテゴリー名をもっと見る</a>

  <div th:replace="~{shared/footer :: main-footer}"></div>
</body>
</html>
