<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>購入手続き - Furima</title>
  <link rel="stylesheet" th:href="@{/css/application.css}">
  <link rel="stylesheet" th:href="@{/css/shared/second_header.css}">
  <link rel="stylesheet" th:href="@{/css/shared/footer.css}">
  <link rel="stylesheet" th:href="@{/css/shared/errors.css}">
  <link rel="stylesheet" th:href="@{/css/shared/form.css}">
  <link rel="stylesheet" th:href="@{/css/orders/index.css}">
  
  <script src="https://js.pay.jp/v2/pay.js"></script>
</head>
<body>

<div th:replace="~{shared/header :: second-header}"></div>

<div class="transaction-contents">
  <div class="transaction-main">
    <h1 class="transaction-title-text">購入内容の確認</h1>

    <!-- 購入商品の表示 -->
    <div class="buy-item-info">
      <img th:src="@{${item.img}}" class="buy-item-img" alt="商品画像">
      <div class="buy-item-right-content">
        <h2 class="buy-item-text" th:text="${item.name}">商品名</h2>
        <div class="buy-item-price">
          <p class="item-price-text" th:text="'¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}">¥999,999,999</p>
          <p class="item-price-sub-text" th:text="${item.deliveryFee == 1 ? '着払い(購入者負担)' : (item.deliveryFee == 2 ? '送料込み(出品者負担)' : '')}">配送料負担</p>
        </div>
      </div>
    </div>
    <!-- /購入商品の表示 -->

    <!-- 支払額の表示 -->
    <div class="item-payment">
      <h1 class="item-payment-title">支払金額</h1>
      <p class="item-payment-price" th:text="'¥' + ${#numbers.formatInteger(item.price, 1, 'COMMA')}">¥販売価格</p>
    </div>
    <!-- /支払額の表示 -->

    <!-- 購入フォーム -->
    <form id="charge-form" th:action="@{/items/{itemId}/orders(itemId=${item.id})}" th:object="${orderForm}" method="post" class="transaction-form-wrap">

      <!-- エラーメッセージ表示領域 -->
      <div th:replace="~{shared/errors :: error-messages(object=${orderForm})}"></div>
      <div th:if="${#fields.hasErrors('*')}" class="error-alert">
        <ul>
          <li th:each="err : ${#fields.errors('*')}" th:text="${err}" class="error-message"></li>
        </ul>
      </div>
      <div th:if="${paymentError}" class="error-alert">
        <ul>
          <li th:text="${paymentError}" class="error-message"></li>
        </ul>
      </div>

      <!-- カード情報の入力 -->
      <div class="credit-card-form">
        <h1 class="info-input-haedline">クレジットカード情報入力</h1>
        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">カード情報</label>
            <span class="indispensable">必須</span>
          </div>
          <div id="number-form" class="input-default"></div>
          <div class="available-card">
            <img th:src="@{/images/card-visa.gif}" class="card-logo" alt="VISA">
            <img th:src="@{/images/card-mastercard.gif}" class="card-logo" alt="MasterCard">
            <img th:src="@{/images/card-jcb.gif}" class="card-logo" alt="JCB">
            <img th:src="@{/images/card-amex.gif}" class="card-logo" alt="AMEX">
          </div>
        </div>
        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">有効期限</label>
            <span class="indispensable">必須</span>
          </div>
          <div class="input-expiration-date-wrap">
            <div id="expiry-form" class="input-default"></div>
          </div>
        </div>
        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">セキュリティコード</label>
            <span class="indispensable">必須</span>
          </div>
          <div id="cvc-form" class="input-default"></div>
        </div>
      </div>
      <!-- /カード情報の入力 -->

      <!-- 配送先の入力 -->
      <div class="shipping-address-form">
        <h1 class="info-input-haedline">配送先入力</h1>
        
        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">郵便番号</label>
            <span class="indispensable">必須</span>
          </div>
          <input th:field="*{postalCode}" type="text" class="input-default" id="postal-code" placeholder="例）123-4567" maxlength="8">
        </div>

        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">都道府県</label>
            <span class="indispensable">必須</span>
          </div>
          <select th:field="*{prefectureId}" class="select-box">
            <option value="">--</option>
            <option th:each="pref : ${prefectures}" th:value="${pref.code}" th:text="${pref.displayName}"></option>
          </select>
        </div>

        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">市区町村</label>
            <span class="indispensable">必須</span>
          </div>
          <input th:field="*{city}" type="text" class="input-default" id="city" placeholder="例）横浜市緑区">
        </div>

        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">番地</label>
            <span class="indispensable">必須</span>
          </div>
          <input th:field="*{address}" type="text" class="input-default" id="address" placeholder="例）青山1-1-1">
        </div>

        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">建物名</label>
            <span class="form-any">任意</span>
          </div>
          <input th:field="*{building}" type="text" class="input-default" id="building" placeholder="例）柳ビル103">
        </div>

        <div class="form-group">
          <div class="form-text-wrap">
            <label class="form-text">電話番号</label>
            <span class="indispensable">必須</span>
          </div>
          <input th:field="*{phoneNumber}" type="text" class="input-default" id="phone-number" placeholder="例）09012345678" maxlength="11">
        </div>
      </div>
      <!-- /配送先の入力 -->

      <div class="buy-btn">
        <button type="submit" class="buy-red-btn" id="button">購入</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{shared/footer :: main-footer}"></div>

<!-- PAY.JP公開鍵のJS渡し & トークン生成スクリプト -->
<script th:inline="javascript">
  const PAYJP_PUBLIC_KEY = /*[[${payjpPublicKey}]]*/ 'pk_test_dummy';
</script>
<script th:src="@{/js/card.js}"></script>
</body>
</html>
