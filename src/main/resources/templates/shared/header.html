<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<body>
<!-- CSS: /css/shared/header.css -->
<header th:fragment="top-header" class="top-page-header">
  <div class="search-bar-contents">
    <a href="/">
      <img src="/images/furima-logo-color.png" alt="FURIMA" class="furima-icon">
    </a>
    <form class="search-form" action="#">
      <input class="input-box" placeholder="キーワードから探す">
      <button class="search-button">
        <img src="/images/search.png" class="search-icon" alt="検索">
      </button>
    </form>
  </div>
  <div class="nav">
    <ul class="lists-left">
      <li><a href="#" class="category-list">カテゴリー</a></li>
      <li><a href="#" class="brand-list">ブランド</a></li>
    </ul>
    <ul class="lists-right">
      <!-- ログインしている場合 -->
      <th:block sec:authorize="isAuthenticated()">
        <li>
          <a href="#" class="user-nickname" 
             th:text="${#authentication.principal.class.simpleName == 'CustomUserDetails' ? #authentication.principal.user.nickname : #authentication.name}">
            ユーザー名
          </a>
        </li>
        <li>
          <!-- Spring Security のログアウトは POST 送信が基本 -->
          <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout" style="background: none; border: none; padding: 0; font: inherit; cursor: pointer;">ログアウト</button>
          </form>
        </li>
      </th:block>

      <!-- ログインしていない場合 -->
      <th:block sec:authorize="!isAuthenticated()">
        <li><a th:href="@{/users/sign_in}" class="login">ログイン</a></li>
        <li><a th:href="@{/users/sign_up}" class="sign-up">新規登録</a></li>
      </th:block>
    </ul>
  </div>
</header>

<header th:fragment="second-header" class="second-header">
  <a href="/"><img src="/images/furima-logo-color.png" alt="FURIMA" class="second-logo"></a>
</header>
</body>
</html>
